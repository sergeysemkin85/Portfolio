# Публикация сайта на GitHub Pages при каждом push в ветку main.
# Настройка: Settings → Pages → Source: GitHub Actions.
# Без настроек сайт собирается для адреса https://<логин>.github.io/<репозиторий>/.
# Для своего домена: Settings → Secrets and variables → Actions → Variables:
#   SITE_URL  — адрес сайта, например https://semkin.ru
#   BASE_PATH — "/" для своего домена или "/имя-репозитория" без домена
#   PUBLIC_YM_ID, PUBLIC_GA_ID — счётчики аналитики (необязательно)
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          SITE_URL: ${{ vars.SITE_URL || format('https://{0}.github.io', github.repository_owner) }}
          BASE_PATH: ${{ vars.BASE_PATH || format('/{0}', github.event.repository.name) }}
          PUBLIC_YM_ID: ${{ vars.PUBLIC_YM_ID }}
          PUBLIC_GA_ID: ${{ vars.PUBLIC_GA_ID || 'G-EM5C70MPTX' }}
      # PDF-версия сайта для кнопки «Скачать в PDF»
      - run: npx playwright-core install --with-deps chromium
      - run: npm run pdf
        env:
          BASE_PATH: ${{ vars.BASE_PATH || format('/{0}', github.event.repository.name) }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
